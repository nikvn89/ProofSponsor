name: CI

on:
  push:
  pull_request:

jobs:
  contract:
    name: Contract — unit suites, GenVM Direct Mode, lint, mutation matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/gltest-direct
          key: gltest-direct-genvm-v0.2.16
      - run: pip install -r requirements-test.txt
      - name: V2/V3 unit suites
        run: python -m unittest discover -s tests -v
      - name: V4 GenVM Direct Mode suite
        run: python -m pytest tests/direct -q -p no:cacheprovider
      - name: genvm-linter (V3 and V4)
        run: |
          python -m genvm_linter.cli lint contracts/ProofSponsorV3.py
          python -m genvm_linter.cli lint contracts/ProofSponsorV4.py
      - name: V4 mutation matrix
        run: python tests/mutation_check.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
